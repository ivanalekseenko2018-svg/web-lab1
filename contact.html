        <h1>Ілон Маск</h1>

            <ul>

                <li><a href="contact.html">Контакти</a></li>

        </nav>

    <main>
        <section>
        <h2 style="text-align: center;">Зв'яжіться з нами</h2>


        <form class="registration-form">
    <h3>Форма реєстрації</h3>
    
    <div class="form-row"> 
    
        <div class="column"> 
            <label>Ім'я:</label><br>
            <input type="text" pattern="[A-Za-zА-Яа-яІіЇїЄєҐґ'\s]+" required><br>
            
            <label>Прізвище:</label><br>
            <input type="text" pattern="[A-Za-zА-Яа-яІіЇїЄєҐґ'\s]+" required><br>
            
            <label>Стать:</label><br>
            <input type="radio" name="gender" required> Чоловіча
            <input type="radio" name="gender" required> Жіноча<br>
            
            <label>Вік:</label><br>
            <input type="number" min="1" max="150" required><br>
            
            <label>Дата народження:</label><br>
            <input type="date"><br>
        </div>
        
        <div class="column"> 
            <label>Країна проживання:</label><br>
            <select required>
                <option value="" disabled selected hidden>Оберіть країну проживання</option>
                <option value="ua">Україна</option>
                <option value="us">США</option>
                <option value="eu">Європа</option>
            </select>

            <label>Номер телефону:</label><br>
            <input type="tel" pattern="[\+0-9\-\(\)\s]+" maxlength="17" placeholder="+38(0XX)XXX-XX-XX" required><br>

            <label>Соцмережа:</label><br>
            <input type="url" placeholder="Посилання на соцмережу"><br>

            <label>Електронна пошта:</label><br>
            <input type="email" placeholder="Ел. пошта" required><br>

            <label>Пароль:</label><br>
            <input type="password" placeholder="Пароль" required><br>
        </div>
        
    </div> 

    
    <input type="checkbox" required>
    <label>Чи згідні Ви з умовами?</label><br><br>
<div style="text-align: center;">
    <button type="submit">Зареєструватися</button>
    <button type="reset">Відміна</button>
    </div>
</form>


<!-- Форма входу -->
        <form class="login-form">
            <h3 style="text-align: center;">Форма входу</h3>
            
            <label>Логін (Email):</label><br>
            <input type="email" required><br>
            
            <label>Пароль:</label><br>
            <input type="password" required><br><br>
            
            <button type="submit">Увійти</button>
        </form>




        <!--Зворотний зв'язок -->
        <br>
        <form class="feedback-form">
            <h3>Форма зворотного зв'язку</h3> 
            
            <div class="form-row"> 
                
                <div class="column">
                        <label>Ім'я:</label><br>
                        <input type="text" pattern="[A-Za-zА-Яа-яІіЇїЄєҐґ'\s]+" required><br>

                        <label>Пошта:</label><br>
                        <input type="email" required><br>

                        <label>Тема повідомлення:</label><br>
                        <input type="text" required><br>
            </div>
                  
                <div class="column">
                    <label>Повідомлення:</label><br>
                    <textarea rows="10" cols="30" required></textarea><br>

                    <button type="reset">Очистити</button>
                    <button type="submit">Відправити</button>
                </div>
                
            </div>
        </form>
    </section>
</main>
